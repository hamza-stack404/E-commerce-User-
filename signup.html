<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nova Market — considered goods for a quieter kind of home. Ceramics, linens, and everyday objects chosen to last.">
<meta property="og:title" content="Nova Market">
<meta property="og:description" content="Considered goods for a quieter kind of home.">
<meta property="og:type" content="website">
<title>Create Account — Nova Market</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-serif: 'Fraunces', serif;
    --font-sans: 'Inter', sans-serif;
    --color-ivory: #FAF7F2;
    --color-ink: #1C1917;
    --color-rust: #A8442E;
    --color-forest: #2F4538;
  }
</style>
</head>
<body class="bg-ivory text-ink font-sans min-h-screen flex flex-col">

  <header class="border-b border-ink/10">
    <div class="max-w-7xl mx-auto px-6 lg:px-10 flex items-center justify-center h-20">
      <a href="index.html" class="font-serif text-2xl font-medium tracking-tight">Nova<span class="text-rust">.</span></a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <h1 class="font-serif text-3xl font-medium mb-2">Create your account</h1>
        <p class="text-sm text-ink/50">Join Nova for faster checkout and order tracking</p>
      </div>

      <form id="signup-form" class="space-y-5">
        <div>
          <label for="full-name" class="block text-sm font-medium mb-1.5">Full Name</label>
          <input type="text" id="full-name" required placeholder="Your name"
            class="w-full px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
        </div>

        <div>
          <label for="signup-email" class="block text-sm font-medium mb-1.5">Email</label>
          <input type="email" id="signup-email" required placeholder="you@email.com"
            class="w-full px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
        </div>

        <div>
          <label for="signup-password" class="block text-sm font-medium mb-1.5">Password</label>
          <input type="password" id="signup-password" required minlength="8" placeholder="At least 8 characters"
            class="w-full px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
        </div>

        <div>
          <label for="confirm-password" class="block text-sm font-medium mb-1.5">Confirm Password</label>
          <input type="password" id="confirm-password" required minlength="8" placeholder="Re-enter password"
            class="w-full px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
        </div>

        <div id="signup-error" class="hidden text-sm text-rust bg-rust/5 border border-rust/20 rounded-sm px-3 py-2">
          Something went wrong. Please check your details.
        </div>

        <button type="submit"
          class="w-full bg-ink text-ivory text-sm font-medium py-3.5 hover:bg-rust">
          Create Account
        </button>
      </form>

      <p class="text-center text-sm text-ink/50 mt-6">
        Already have an account? <a href="login.html" class="text-ink font-medium border-b border-ink/30 hover:border-rust hover:text-rust">Sign in</a>
      </p>
    </div>
  </main>

<script type="module" src="signup.js"></script>
</body>
</html>
