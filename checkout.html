<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Nova Market — considered goods for a quieter kind of home. Ceramics, linens, and everyday objects chosen to last.">
<meta property="og:title" content="Nova Market">
<meta property="og:description" content="Considered goods for a quieter kind of home.">
<meta property="og:type" content="website">
<title>Checkout — Nova Market</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-serif: 'Fraunces', serif;
    --font-sans: 'Inter', sans-serif;
    --color-ivory: #FAF7F2;
    --color-ink: #1C1917;
    --color-rust: #A8442E;
    --color-forest: #2F4538;
  }
</style>
</head>
<body class="bg-ivory text-ink font-sans">

  <header class="border-b border-ink/10">
    <div class="max-w-7xl mx-auto px-6 lg:px-10 flex items-center justify-between h-20">
      <a href="index.html" class="font-serif text-2xl font-medium tracking-tight">Nova<span class="text-rust">.</span></a>
      <p class="text-sm text-ink/40">Secure Checkout</p>
    </div>
  </header>

  <!-- Steps -->
  <div class="max-w-5xl mx-auto px-6 lg:px-10 pt-8">
    <div class="flex items-center gap-3 text-sm">
      <span class="flex items-center gap-2 text-ink"><span class="w-6 h-6 rounded-full bg-ink text-ivory text-xs flex items-center justify-center">1</span>Shipping</span>
      <span class="w-8 border-t border-ink/20"></span>
      <span class="flex items-center gap-2 text-ink/40"><span class="w-6 h-6 rounded-full border border-ink/20 text-xs flex items-center justify-center">2</span>Payment</span>
      <span class="w-8 border-t border-ink/20"></span>
      <span class="flex items-center gap-2 text-ink/40"><span class="w-6 h-6 rounded-full border border-ink/20 text-xs flex items-center justify-center">3</span>Review</span>
    </div>
  </div>

  <section class="max-w-5xl mx-auto px-6 lg:px-10 py-10 grid grid-cols-1 lg:grid-cols-12 gap-12">

    <!-- Form -->
    <div class="lg:col-span-7">
      <form id="checkout-form" class="space-y-8">

        <div>
          <p class="font-serif text-xl mb-5">Shipping Address</p>
          <div class="grid grid-cols-2 gap-4">
            <input type="text" required placeholder="First name" class="col-span-1 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="text" required placeholder="Last name" class="col-span-1 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="text" required placeholder="Address" class="col-span-2 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="text" required placeholder="City" class="col-span-1 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="text" required placeholder="Postal code" class="col-span-1 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="tel" required placeholder="Phone number" class="col-span-2 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
          </div>
        </div>

        <div>
          <p class="font-serif text-xl mb-5">Payment Details</p>
          <div class="grid grid-cols-2 gap-4">
            <input type="text" required placeholder="Card number" class="col-span-2 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="text" required placeholder="MM / YY" class="col-span-1 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
            <input type="text" required placeholder="CVC" class="col-span-1 px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
          </div>
          <p class="text-xs text-ink/40 mt-3">This is a school project — no real payment is processed.</p>
        </div>

        <button type="submit" id="checkout-submit-btn" class="w-full bg-ink text-ivory py-4 text-sm font-medium hover:bg-rust">
          Place Order — $00.00
        </button>
      </form>
    </div>

    <!-- Order summary -->
    <div class="lg:col-span-5">
      <div class="border border-ink/10 rounded-sm p-6">
        <p class="font-serif text-lg mb-5">Order Summary</p>

        <div id="checkout-items" class="space-y-4 mb-5">

        </div>

        <div class="border-t border-ink/10 pt-4 space-y-3 text-sm">
           <div class="flex justify-between text-ink/60"><span>Subtotal</span><span id="checkout-subtotal" class="text-ink">$116.00</span></div>
           <div class="flex justify-between text-ink/60"><span>Shipping</span><span class="text-forest">Free</span></div>
           <div class="flex justify-between text-ink/60"><span>Tax</span><span id="checkout-tax" class="text-ink">$0.00</span></div>
           </div>
           <div class="border-t border-ink/10 mt-4 pt-4 flex justify-between font-medium">
               <span>Total</span>
               <span id="checkout-total">$0.00</span>
           </div>
      </div>
    </div>

  </section>

<script type="module" src="checkout.js"></script>
</body>
</html>
