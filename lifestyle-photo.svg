  <path d="M110 190 L145 130 L170 165 L190 140 L190 190 Z" fill="#A8442E" opacity="0.4"/>

  <!-- floor line -->
  <line x1="0" y1="330" x2="500" y2="330" stroke="#1C1917" stroke-width="2" opacity="0.15"/>

