<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Nova Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-serif: 'Fraunces', serif;
    --font-sans: 'Inter', sans-serif;
    --color-ivory: #FAF7F2;
    --color-ink: #1C1917;
    --color-rust: #A8442E;
    --color-forest: #2F4538;
  }
</style>
</head>
<body class="bg-ivory text-ink font-sans min-h-screen flex flex-col">

  <header class="border-b border-ink/10">
    <div class="max-w-7xl mx-auto px-6 lg:px-10 flex items-center justify-center h-20">
      <a href="index.html" class="font-serif text-2xl font-medium tracking-tight">Nova<span class="text-rust">.</span></a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <h1 class="font-serif text-3xl font-medium mb-2">Welcome back</h1>
        <p class="text-sm text-ink/50">Sign in to continue to your account</p>
      </div>

      <form id="form" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium mb-1.5">Email</label>
          <input type="email" id="email" placeholder="you@email.com"
            class="w-full px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-1.5">Password</label>
          <input type="password" id="password" placeholder="••••••••"
            class="w-full px-4 py-3 border border-ink/20 rounded-sm text-sm focus:outline-none focus:border-rust">
        </div>

        <div id="login-error" class="hidden text-sm text-rust bg-rust/5 border border-rust/20 rounded-sm px-3 py-2">
          Invalid email or password.
        </div>

        <button type="submit"
          class="w-full bg-ink text-ivory text-sm font-medium py-3.5 hover:bg-rust">
          Sign In
        </button>
      </form>

      <p class="text-center text-sm text-ink/50 mt-6">
        New to Nova? <a href="signup.html" class="text-ink font-medium border-b border-ink/30 hover:border-rust hover:text-rust">Create an account</a>
      </p>
    </div>
  </main>

  <!-- js/user-login.js will handle real auth in Phase 3 -->
</body>
</html>
